name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Papuma.Kernel.slnx

      - name: Build
        run: dotnet build Papuma.Kernel.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Papuma.Kernel.slnx --configuration Release --no-build --verbosity normal

      # No --no-build here: symbol packages (IncludeSymbols) re-invoke the Build target,
      # which NoBuild rejects (NETSDK1085).
      - name: Pack
        run: dotnet pack Papuma.Kernel.slnx --configuration Release --output artifacts

      # The same check the release runs: every package present under the <Version> of
      # Directory.Build.props, and Papuma.Kernel.Core.dll embedded where it must be.
      - name: Verify packages
        run: |
          set -euo pipefail
          VERSION="$(dotnet msbuild src/Papuma.Kernel/Papuma.Kernel.csproj -getProperty:Version)"
          bash .github/scripts/verify-packages.sh artifacts "$VERSION"

      - name: Upload NuGet package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: papuma-kernel-nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
