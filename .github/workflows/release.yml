name: Release

# Publishes to nuget.org via Trusted Publishing (OIDC) — no long-lived API key
# stored anywhere. Setup and the release steps are in CONTRIBUTING.md ("Releasing").
#
# Triggered by pushing a tag vX.Y.Z[-suffix], or manually (Actions tab / `gh workflow
# run release.yml -f tag=vX.Y.Z`) — the manual path takes an explicit tag input and
# checks that tag out. Every package's <Version> must equal the tag's version, or
# nothing reaches nuget.org. The tag's tree must contain .github/scripts/verify-packages.sh,
# so tags from before that script cannot be published by this workflow.
#
# Three jobs, so the OIDC token is never reachable from restore, build or test, and the
# write access to the repository never from the push:
#   build          — checkout, restore, build, test, pack, verify, release notes, upload;
#                    contents: read only.
#   publish        — download, attest, login, push; no checkout, no restore. Runs in the
#                    `nuget-org` environment, whose required reviewers gate the push.
#   github-release — creates the GitHub release of the tag from the notes the build job
#                    wrote (.github/release-notes/<tag>.md, else the CHANGELOG section);
#                    contents: write, nothing else. A tag with a suffix is a pre-release.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v3.0.0) — must already exist"
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.ref.outputs.tag }}

    steps:
      # The tag only reaches the shell through env, never through ${{ }} in a script.
      - name: Resolve and validate the tag
        id: ref
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '${TAG}' is not vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout ${{ steps.ref.outputs.tag }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.ref.outputs.tag }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Papuma.Kernel.slnx

      - name: Build
        run: dotnet build Papuma.Kernel.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Papuma.Kernel.slnx --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack Papuma.Kernel.slnx --configuration Release --output artifacts

      # Fails closed: exact file name per package (version == tag) and the embedded Core assembly.
      - name: Verify packages
        env:
          VERSION: ${{ steps.ref.outputs.version }}
        run: bash .github/scripts/verify-packages.sh artifacts "$VERSION"

      - name: Write release notes
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: bash .github/scripts/release-notes.sh "$TAG" artifacts/release-notes.md

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: papuma-kernel-nupkg-${{ steps.ref.outputs.tag }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/release-notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: nuget-org
    permissions:
      id-token: write # NuGet Trusted Publishing and the provenance attestation
      attestations: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: papuma-kernel-nupkg-${{ needs.build.outputs.tag }}
          path: artifacts

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.nupkg

      # NuGet.org username (profile name, not email) — stored as a secret per
      # NuGet's own Trusted Publishing guidance, even though it isn't a credential.
      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # The runner's preinstalled SDK is enough for `dotnet nuget push`; the matching
      # .snupkg files next to the .nupkg are pushed along with them.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release; no id-token, no packages

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: papuma-kernel-nupkg-${{ needs.build.outputs.tag }}
          path: artifacts

      # The runner's preinstalled gh. Idempotent: a release that already exists (created by hand,
      # or by an earlier run of this workflow) is left as it is.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release ${TAG} exists; left unchanged."
            exit 0
          fi
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file artifacts/release-notes.md "${flags[@]}"
