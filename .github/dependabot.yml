version: 2
updates:
  - package-ecosystem: nuget
    # The samples are separate projects outside the solution's src/tests layout; list them
    # explicitly so a change in discovery never silently drops them.
    directories:
      - "/"
      - "/samples/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "Testcontainers*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
